palettes:
  - name: global_palette
    fixed-entries:
      - color: {index: 0, r: 0, g: 0, b: 0}
      - color: {index: 1, r: 255, g: 0, b: 0}

      # elixir color
      - color: {index: 202 ,r: 226, g: 142, b: 238}

      # transparent color
      - color: {index: 170, r: 255, g: 0, b: 255}

      # yellow
      - color: {index: 171, r: 255, g: 255, b: 0}

      # green
      - color: {index: 158, r: 158, g: 181, b: 86}

      #white
      - color: {index: 255, r: 255, g: 255, b: 255}

      # tower red for health bars
      - color: {index: 150,r: 250,g: 100, b: 100}

      # bar background
      - color: {index: 136, r: 80, g: 90, b: 140}

      # tower blue for health bars
      - color: {index: 151,r: 105,g: 170, b: 240}

      # main menu
      # unselected tab color
      - color: {index: 83, r: 70, g: 80, b: 100}
      # selected tab color
      - color: {index: 116, r: 80, g: 120, b: 150}

      # menu grids
      # lighter
      - color: {index: 89, r: 19, g: 96, b: 154}
      # darker
      - color: {index: 80, r: 19, g: 83, b: 138}
      # line
      - color: {index: 68, r: 11, g: 67, b: 126}

    images: automatic

converts:
  # Split into multiple smaller groups to stay under 64KB per AppVar

  # Group 1: UI elements and small sprites
  - name: ui_sprites
    palette: global_palette
    transparent-color-index: 170
    images:
      - cards/projectiles/arrow.png
      - cards/projectiles/bullet.png
      - ui/clock.png
      - ui/battle_icon.png
      - ui/deck_icon.png
      - ui/trophy.png
      - ui/blue_crown.png
      - ui/red_crown.png
      - ui/empty_crown.png
      - ui/deck_text.png
      - ui/gold_coin.png
      - ui/exit_button.png
      - ui/play_again.png
      - ui/ok_button.png
      - chests/silver_chest.png
      - chests/gold_chest.png
      - chests/magical_chest.png

  # Group 2: Card sprites and towers
  - name: card_sprites
    palette: global_palette
    transparent-color-index: 170
    images:
      - cards/miner_card.png
      - cards/musketeer_card.png
      - cards/balloon_card.png
      - cards/giant_card.png
      - cards/zap_card.png
      - cards/poison_card.png
      - cards/elixir_collector_card.png
      - cards/knight_card.png
      - map/towers/princess_tower.png
      - map/towers/princess_tower_opponent.png
      - map/towers/king_tower.png
      - map/towers/king_tower_opponent.png

  # Group 3: Map tiles and logo (large sprites)
  - name: map_sprites
    palette: global_palette
    transparent-color-index: 170
    images:
      - map/tiles/grass.png
      - map/tiles/riverbank.png
      - map/tiles/riverbank_alt.png
      - map/tiles/bridge.png
      - map/tiles/walkway_small.png
      - map/tiles/walkway_opponent_small.png
      - ui/logo.png
      - ui/battle.png

  # Group 4: Miner and Musketeer troop animations
  - name: troop_sprites1
    palette: global_palette
    transparent-color-index: 170
    images:
      - cards/troops/miner/miner_stepL.png
      - cards/troops/miner/miner_stepR.png
      - cards/troops/miner/miner_attack.png
      - cards/troops/miner/miner_stepL_opp.png
      - cards/troops/miner/miner_stepR_opp.png
      - cards/troops/miner/miner_attack_opp.png
      - cards/troops/musketeer/musketeer_stepN.png
      - cards/troops/musketeer/musketeer_stepL.png
      - cards/troops/musketeer/musketeer_stepR.png
      - cards/troops/musketeer/musketeer_attack.png
      - cards/troops/musketeer/musketeer_stepL_opp.png
      - cards/troops/musketeer/musketeer_stepR_opp.png
      - cards/troops/musketeer/musketeer_attack_opp.png

  # Group 5: Giant and Knight troop animations
  - name: troop_sprites2
    palette: global_palette
    transparent-color-index: 170
    images:
      - cards/troops/giant/g_stepN.png
      - cards/troops/giant/g_stepL.png
      - cards/troops/giant/g_stepR.png
      - cards/troops/giant/g_attack.png
      - cards/troops/giant/g_stepN_opp.png
      - cards/troops/giant/g_stepL_opp.png
      - cards/troops/giant/g_stepR_opp.png
      - cards/troops/giant/g_attack_opp.png
      - cards/troops/knight/knight_stepN.png
      - cards/troops/knight/knight_stepL.png
      - cards/troops/knight/knight_stepR.png
      - cards/troops/knight/knight_attack.png
      - cards/troops/knight/knight_stepN_opp.png
      - cards/troops/knight/knight_stepL_opp.png
      - cards/troops/knight/knight_stepR_opp.png
      - cards/troops/knight/knight_attack_opp.png

  # Group 6: Balloon and buildings
  - name: troop_sprites3
    palette: global_palette
    transparent-color-index: 170
    images:
      - cards/troops/balloon/balloon.png
      - cards/troops/balloon/balloon_opp.png
      - cards/buildings/elixir_collector/elixir_collector.png

  # Group 7: Number sprites for rotated text display
  - name: number_sprites
    palette: global_palette
    transparent-color-index: 170
    images:
      - numbers/minute.png
      - numbers/second.png
      - ui/digits_sprite.png

outputs:
  # Palette must be compiled into program (not in appvar)
  - type: c
    include-file: global_palette.h
    palettes:
      - global_palette

  # Split sprites across multiple appvars to stay under 64KB each
  - type: appvar
    name: CRUI
    include-file: gfx_ui.h
    source-format: c
    converts:
      - ui_sprites
      - number_sprites

  - type: appvar
    name: CRCARD
    include-file: gfx_card.h
    source-format: c
    converts:
      - card_sprites

  - type: appvar
    name: CRMAP
    include-file: gfx_map.h
    source-format: c
    converts:
      - map_sprites

  - type: appvar
    name: CRTRP1
    include-file: gfx_trp1.h
    source-format: c
    converts:
      - troop_sprites1

  - type: appvar
    name: CRTRP2
    include-file: gfx_trp2.h
    source-format: c
    converts:
      - troop_sprites2

  - type: appvar
    name: CRTRP3
    include-file: gfx_trp3.h
    source-format: c
    converts:
      - troop_sprites3
